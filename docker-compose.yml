services:
  mysql:
    image: mysql:8.4
    container_name: assistente-financeiro-mysql
    environment:
      MYSQL_DATABASE: assistente_financeiro
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: